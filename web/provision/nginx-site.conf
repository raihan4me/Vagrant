server {
    listen 80 default_server;
    server_name _;
    root /srv/site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
    location /meta/ {
        alias /var/www/meta/;
        default_type text/plain;
    }
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
